<div class="page-container reports">
  <header class="page-header">
    <div class="header-content">
      <h1>📈 {{ copy().title }}</h1>
      <p class="subtitle">
        {{ copy().subtitle }}
        <span class="role-badge">{{ copy().badge }}</span>
      </p>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" type="button" (click)="exportCsv()">⬇ Export CSV</button>
      <button class="btn-primary" type="button" (click)="printReport()">🖨 Print / PDF</button>
    </div>
  </header>

  <!-- One filter row above everything it scopes: every chart re-renders on the same slice. -->
  <section class="filter-bar" aria-label="Report filters">
    <div class="filter-group">
      <span class="filter-label">Period</span>
      <div class="segmented" role="group" aria-label="Reporting period">
        @for (option of ranges; track option.key) {
          <button
            type="button"
            [class.is-active]="range() === option.key"
            [attr.aria-pressed]="range() === option.key"
            (click)="range.set(option.key)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>

    <p class="filter-summary">
      <strong>{{ periodLabel() }}</strong>
      <span>deltas {{ comparisonLabel() }}</span>
    </p>
  </section>

  @switch (role()) {
    @case ('home_dean') {
      <app-dean-report [range]="range()" />
    }
    @case ('vpsas') {
      <app-vpsas-report [range]="range()" />
    }
    @case ('business_officer') {
      <app-bo-report [range]="range()" />
    }
    @default {
      <app-overview-report [range]="range()" />
    }
  }
</div>
