<div class="security-layout" [class.sidebar-open]="isSidebarOpen()">
  <!-- Mobile Header -->
  <header class="mobile-header">
    <button class="menu-toggle" (click)="toggleSidebar()">
      <span class="hamburger-icon">☰</span>
    </button>
    <div class="mobile-logo">
      @if (settingsService.systemLogo()) {
        <img class="logo-img" [src]="settingsService.systemLogo()" alt="PAC DMS" />
      } @else {
        <span class="logo-icon">🛡️</span>
      }
      <span class="logo-text">{{ settingsService.systemName() }} Security</span>
    </div>
    <div class="header-right">
      <app-notification-dropdown />
      <!-- Logout stays in the header on mobile: it is one tap from anywhere, rather than
           behind the menu. -->
      <button class="mobile-logout-btn" (click)="logout()" title="Logout">
        <span>🚪</span>
      </button>
    </div>
  </header>

  <!-- Overlay for mobile — tapping outside the sidebar closes it -->
  <div class="sidebar-overlay" (click)="closeSidebar()"></div>

  <aside class="security-sidebar">
    <div class="sidebar-header">
      <div class="logo">
        @if (settingsService.systemLogo()) {
          <img class="logo-img" [src]="settingsService.systemLogo()" alt="PAC DMS" />
        } @else {
          <span class="logo-icon">🛡️</span>
        }
        <span class="logo-text">{{ settingsService.systemName() }} Security</span>
      </div>
      <button class="close-sidebar" (click)="closeSidebar()">✕</button>
    </div>

    <!-- Every entry here points at a page backed by real data; nothing is listed that the
         guard cannot actually use. -->
    <nav class="sidebar-nav">
      <a
        routerLink="/security-guard/check-in-out"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeSidebar()"
      >
        <span class="nav-icon">🚪</span>
        <span class="nav-label">Check In/Out</span>
      </a>
      <a
        routerLink="/security-guard/dashboard"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeSidebar()"
      >
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a
        routerLink="/security-guard/reports"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeSidebar()"
      >
        <span class="nav-icon">📋</span>
        <span class="nav-label">Report</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="guard-info">
        <div class="avatar">SG</div>
        <div class="guard-details">
          <span class="guard-name">Security Guard</span>
          <span class="guard-shift">Night Shift</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <span class="logout-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>
  <main class="security-content">
    <div class="desktop-notification-bar">
      <app-notification-dropdown />
    </div>
    <router-outlet />
  </main>

  <!-- Mobile bottom tab bar: the same three destinations as the sidebar, thumb-reachable. -->
  <nav class="bottom-tab-bar">
    <a routerLink="/security-guard/check-in-out" routerLinkActive="active" class="tab-item">
      <span class="tab-icon">🚪</span>
      <span class="tab-label">Check</span>
    </a>
    <a routerLink="/security-guard/dashboard" routerLinkActive="active" class="tab-item">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Dashboard</span>
    </a>
    <a routerLink="/security-guard/reports" routerLinkActive="active" class="tab-item">
      <span class="tab-icon">📋</span>
      <span class="tab-label">Report</span>
    </a>
  </nav>
</div>
