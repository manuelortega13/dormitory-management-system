<div class="admin-layout">
  <!-- Mobile header -->
  <header class="mobile-header">
    <span class="mobile-logo">
      @if (settingsService.systemLogo()) {
        <img
          class="logo-img"
          [src]="settingsService.systemLogo()"
          [alt]="settingsService.systemName()"
        />
      } @else {
        🏠
      }
      {{ settingsService.systemName() }}
    </span>
    <div class="header-right">
      <app-notification-dropdown />
      <button class="mobile-logout-btn" (click)="logout()" title="Logout">
        <span>🚪</span>
      </button>
    </div>
  </header>

  <app-sidebar />
  <main class="admin-content">
    <div class="desktop-top-bar">
      <app-notification-dropdown />
      <button class="logout-btn" (click)="logout()" title="Logout">
        <span class="logout-icon">🚪</span>
        <span class="logout-text">Logout</span>
      </button>
    </div>
    <router-outlet />
  </main>

  <!-- Mobile bottom tab bar -->
  <nav class="bottom-tab-bar">
    <a routerLink="/manage/dashboard" routerLinkActive="active" class="tab-item">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Dashboard</span>
    </a>
    <a routerLink="/manage/residents" routerLinkActive="active" class="tab-item">
      <span class="tab-icon">👥</span>
      <span class="tab-label">Occupants</span>
    </a>
    <a routerLink="/manage/leave-requests" routerLinkActive="active" class="tab-item">
      <span class="tab-icon">📋</span>
      <span class="tab-label">Leaves</span>
    </a>
    <!--    <a routerLink="/manage/payments" routerLinkActive="active" class="tab-item">-->
    <!--      <span class="tab-icon">💰</span>-->
    <!--      <span class="tab-label">Payments</span>-->
    <!--    </a>-->
    <button class="tab-item" [class.active]="showMobileMore()" (click)="toggleMobileMore()">
      <span class="tab-icon">☰</span>
      <span class="tab-label">More</span>
    </button>
  </nav>

  <!-- Mobile more menu overlay -->
  @if (showMobileMore()) {
    <div class="mobile-more-overlay" (click)="closeMobileMore()"></div>
    <div class="mobile-more-sheet">
      <div class="sheet-handle"></div>
      @for (item of moreItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="sheet-item"
          (click)="closeMobileMore()"
        >
          <span class="sheet-icon">{{ item.icon }}</span>
          <span class="sheet-label">{{ item.label }}</span>
        </a>
      }
      <button class="sheet-item sheet-logout" (click)="closeMobileMore(); logout()">
        <span class="sheet-icon">🚪</span>
        <span class="sheet-label">Logout</span>
      </button>
    </div>
  }
</div>
